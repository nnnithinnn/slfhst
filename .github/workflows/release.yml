name: Release ISO

# Separate from publish.yml on purpose: publish.yml republishes the rolling
# :stable bootc image on every merge (what slfhst-bootc-update.timer tracks
# day to day) -- building a multi-GB installer ISO on every merge would be
# wasteful. This only runs for an actual release: push a `vX.Y.Z` tag, or
# trigger it manually.
#
# Verified end-to-end on a real GitHub-hosted runner -- see git history for
# the fixes that took (rootful bootc-image-builder invocation, storage
# mount/pull semantics, a runner storage-driver workaround, pointing dnf at
# repo.almalinux.org directly, and publishing the ISO as a GHCR OCI
# artifact via oras instead of a GitHub release asset since it doesn't fit
# GitHub's 2GiB asset limit).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  ISO_IMAGE: ghcr.io/${{ github.repository }}-iso

jobs:
  release-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oras-project/setup-oras@v1

      # ubuntu-latest ships ~14GB free by default, most of it eaten by
      # preinstalled toolchains this job never touches (.NET, Android SDK,
      # GHC, ...). The Anaconda ISO build downloads several hundred RPMs
      # plus assembles a live filesystem -- reclaim headroom before that,
      # rather than find out mid-build (see git history: two runs died
      # with a burst of simultaneous "Error downloading" package failures,
      # the signature of running out of disk mid parallel-download-batch).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules || true
          df -h /

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      # GitHub's runner images ship /var/lib/containers/storage in an
      # inconsistent state; the first thing to touch it as root can hit a
      # graph-driver mismatch or other corruption. This is bootc-image-
      # builder's own upstream fix for exactly that, copied verbatim from
      # their currently-working GH Actions CI (which builds real disk
      # images the same way we do): https://github.com/osbuild/bootc-image-builder/issues/446
      # and .github/workflows/tests.yml in that repo. Our own two failed
      # runs died mid-build inside bootc-image-builder's podman-in-podman
      # usage of root's storage without ever having explicitly initialized
      # it first -- this closes that gap.
      - name: Workaround podman storage issues in GH Actions
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          echo -e "[storage]\ndriver = \"overlay\"\nrunroot = \"/run/containers/storage\"\ngraphroot = \"/var/lib/containers/storage\"" | sudo tee /etc/containers/storage.conf

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Build appliance image
        run: python3 scripts/build_image.py

      - name: Tag and push versioned image to GHCR
        run: |
          podman tag localhost/slfhst:latest "$IMAGE:$TAG"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE:$TAG"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Disk space before ISO build
        run: df -h /

      # bootc-image-builder pulls this straight from GHCR rather than
      # reading local podman storage -- see scripts/build_iso.py's docstring
      # for why (GH Actions' apt podman is rootless by default).
      - name: Build Anaconda installer ISO
        run: python3 scripts/build_iso.py --type anaconda-iso --image "$IMAGE:$TAG" --output output

      # Two prior runs died mid-RPM-download with no disk pressure (109GB+
      # free both times -- ruled that out already). If it happens again,
      # this settles whether it's an OOM kill: the kernel log is
      # unambiguous about that, unlike osbuild's own traceback which cuts
      # off before printing the actual exception message.
      - name: Diagnose failure (memory/kernel log)
        if: failure()
        run: |
          free -h
          sudo dmesg -T | tail -100 || true

      - name: Locate ISO
        run: |
          ISO_PATH="$(find output -name '*.iso' -print -quit)"
          if [ -z "$ISO_PATH" ]; then
            echo "no .iso produced under output/" >&2
            find output -maxdepth 3 >&2
            exit 1
          fi
          echo "ISO_PATH=$ISO_PATH" >> "$GITHUB_ENV"
          ls -lh "$ISO_PATH"

      # GitHub hard-caps a single release asset at 2GiB ("size must be less
      # than 2147483648") -- confirmed by hitting it for real, and debloating
      # the appliance image doesn't help (the ISO's size is dominated by
      # Anaconda's own live installer environment, not our embedded image).
      # publish_release.py pushes the ISO to GHCR as an OCI artifact via
      # oras instead (no such size limit there) and links to it from the
      # release notes, rather than attaching it as a release asset.
      - name: Publish release (GHCR OCI artifact + GitHub Release notes)
        run: python3 scripts/publish_release.py --tag "$TAG" --image "$IMAGE:$TAG" --iso-path "$ISO_PATH" --iso-repo "$ISO_IMAGE" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
