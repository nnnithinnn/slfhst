name: Publish

# Builds the appliance + installer ISO and publishes both to the rolling
# "latest" GitHub Release. Triggers: push to main, manual dispatch, and a
# daily schedule independent of any code change -- see the plan's
# "Update cadence" section for why the daily trigger matters: this
# appliance's OS content comes from `dnf install` against Fedora's own
# repos at *build* time, not a pinned image digest, so most security
# patches land as in-place repo updates with no code change for a push
# to ever pick up. The daily rebuild is what actually catches those
# promptly.
#
# No GHCR/container-registry push at all -- there's nothing
# container-image-shaped to publish now that the appliance is raw
# partition content (a systemd-sysupdate-managed usr partition + UKI),
# not an OCI image. Everything ships as GitHub Release assets instead:
# the installer ISO, the versioned usr/UKI split artifacts (what
# systemd-sysupdate's url-file transfers fetch), and a SHA256SUMS
# manifest.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily, independent of any code change -- see above.

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false # no go.sum -- stdlib-only, zero external deps

      - name: 1. Precheck
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: 2. Build the slfhst binary
        run: |
          go build -o mkosi/appliance/mkosi.extra/usr/bin/slfhst ./cmd/slfhst
          go build -o mkosi/installer/mkosi.extra/usr/bin/slfhst ./cmd/slfhst

      - name: 3. Install podman, reclaim disk space
        run: |
          sudo apt-get update && sudo apt-get install -y podman

          # ubuntu-latest ships ~14GB free by default, most of it eaten by
          # preinstalled toolchains this job never touches -- reclaim
          # headroom before a multi-GB build rather than find out mid-build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules || true

          # GitHub's runner images ship /var/lib/containers/storage in an
          # inconsistent state; the first privileged podman run to touch
          # it can hit a graph-driver mismatch. Same fix bootc-image-builder
          # itself carries in its own CI, kept here as cheap insurance even
          # though this pipeline doesn't use bootc-image-builder anymore.
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          echo -e "[storage]\ndriver = \"overlay\"\nrunroot = \"/run/containers/storage\"\ngraphroot = \"/var/lib/containers/storage\"" | sudo tee /etc/containers/storage.conf

      - name: 4. Build appliance + installer + ISO
        run: |
          DATE_TAG="$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_ENV"

          sudo podman run --rm --privileged -v "$PWD:/work:Z" -w /work \
            registry.fedoraproject.org/fedora:44 bash -c "
              set -euo pipefail
              dnf -y install mkosi xorriso grub2-tools-extra
              ./mkosi/build-all.sh '$DATE_TAG' output
            "

      - name: Diagnose failure (memory/kernel log)
        if: failure()
        run: |
          free -h
          sudo dmesg -T | tail -100 || true

      - name: 5. Check ISO size against GitHub's 2GiB release-asset cap
        run: |
          ISO_PATH="output/slfhst-installer.iso"
          if [ ! -e "$ISO_PATH" ]; then
            echo "no ISO produced at $ISO_PATH" >&2
            find output -maxdepth 2 >&2
            exit 1
          fi
          SIZE=$(stat -c%s "$ISO_PATH")
          echo "ISO size: $SIZE bytes"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "ISO exceeds GitHub's 2GiB release-asset limit ($SIZE bytes) -- failing loudly rather than silently splitting/compressing." >&2
            exit 1
          fi

      - name: 6. Publish to the rolling "latest" GitHub Release
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          TAG=latest
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create "$TAG" output/*.iso output/*.raw output/*.efi output/SHA256SUMS \
            --title "slfhst ($DATE_TAG)" \
            --notes "Rolling release, replaced on every publish. Version: $DATE_TAG." \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
