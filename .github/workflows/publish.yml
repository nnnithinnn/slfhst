name: Publish

# One pipeline, no exceptions: every push to main builds the appliance
# image AND the Anaconda installer ISO from that exact image, together, in
# the same run, and republishes both. There's no separate semver-tag-gated
# release step any more -- installs happen fully offline, so an ISO that
# embeds a stale image is a correctness bug, not just staleness. Keeping
# the image build and the ISO build in one run is what guarantees they
# always match; splitting them (the old publish.yml/release.yml split) let
# them drift apart between whenever someone remembered to cut a tag.
#
# Verified end-to-end on a real GitHub-hosted runner -- see git history for
# the fixes that took (rootful bootc-image-builder invocation, storage
# mount/pull semantics, a runner storage-driver workaround, and pointing
# dnf at repo.almalinux.org directly instead of the flaky mirrorlist).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile + import every slfhst module
        run: python3 scripts/check.py

      # ubuntu-latest ships ~14GB free by default, most of it eaten by
      # preinstalled toolchains this job never touches (.NET, Android SDK,
      # GHC, ...). The Anaconda ISO build downloads several hundred RPMs
      # plus assembles a live filesystem -- reclaim headroom before that,
      # rather than find out mid-build (see git history: two runs died
      # with a burst of simultaneous "Error downloading" package failures,
      # the signature of running out of disk mid parallel-download-batch).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules || true
          df -h /

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      # GitHub's runner images ship /var/lib/containers/storage in an
      # inconsistent state; the first thing to touch it as root can hit a
      # graph-driver mismatch or other corruption. This is bootc-image-
      # builder's own upstream fix for exactly that, copied verbatim from
      # their currently-working GH Actions CI (which builds real disk
      # images the same way we do): https://github.com/osbuild/bootc-image-builder/issues/446
      # and .github/workflows/tests.yml in that repo.
      - name: Workaround podman storage issues in GH Actions
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          echo -e "[storage]\ndriver = \"overlay\"\nrunroot = \"/run/containers/storage\"\ngraphroot = \"/var/lib/containers/storage\"" | sudo tee /etc/containers/storage.conf

      - name: Build appliance image
        run: python3 scripts/build_image.py

      - name: Tag and push to GHCR
        run: |
          DATE_TAG="$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          podman tag localhost/slfhst:latest "$IMAGE:stable"
          podman tag localhost/slfhst:latest "$IMAGE:$DATE_TAG"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE:stable"
          podman push "$IMAGE:$DATE_TAG"

      - name: Disk space before ISO build
        run: df -h /

      # Built from the dated tag just pushed above, not :stable -- pins the
      # ISO to the exact image this same run produced, immune to a
      # concurrent push moving :stable out from under a slower build.
      - name: Build Anaconda installer ISO
        run: python3 scripts/build_iso.py --type anaconda-iso --image "$IMAGE:$DATE_TAG" --output output

      # Two prior runs died mid-RPM-download with no disk pressure (109GB+
      # free both times -- ruled that out already). If it happens again,
      # this settles whether it's an OOM kill: the kernel log is
      # unambiguous about that, unlike osbuild's own traceback which cuts
      # off before printing the actual exception message.
      - name: Diagnose failure (memory/kernel log)
        if: failure()
        run: |
          free -h
          sudo dmesg -T | tail -100 || true

      - name: Locate ISO
        run: |
          ISO_PATH="$(find output -name '*.iso' -print -quit)"
          if [ -z "$ISO_PATH" ]; then
            echo "no .iso produced under output/" >&2
            find output -maxdepth 3 >&2
            exit 1
          fi
          echo "ISO_PATH=$ISO_PATH" >> "$GITHUB_ENV"
          ls -lh "$ISO_PATH"

      # Rolling: always the "latest" tag/release, replacing whatever ISO
      # was there before -- see scripts/publish_release.py's docstring.
      - name: Publish rolling "latest" GitHub Release with ISO asset
        run: python3 scripts/publish_release.py --tag latest --image "$IMAGE:$DATE_TAG" --iso-path "$ISO_PATH" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
