name: Publish

# Five steps, no more: precheck, build image, build ISO, publish image,
# publish ISO. Every push to main runs all five -- no separate semver-tag-
# gated release step, no GHCR round-trip in the middle. "Build image"
# builds both the appliance image AND the installer image layered on top
# of it (Containerfile.installer -- a live, kickstart-free environment
# that partitions disks and `bootc install`s the appliance image, see that
# file's own comment for why Anaconda is gone entirely). The ISO is built
# straight from the installer image this same run just built locally
# (build_iso.py's localhost/ path: podman save + sudo podman load into
# rootful storage, no registry pull) -- so the ISO build has no network
# dependency on this run's own GHCR push succeeding first, and can't end
# up embedding a different appliance image than what GHCR gets. GHCR still
# gets the appliance image (not the installer image) afterward, for
# already-running nodes' `bootc upgrade` to track.
#
# Verified end-to-end on a real GitHub-hosted runner -- see git history for
# the fixes folded into the "Build image" step below (rootful bootc-image-
# builder invocation, storage mount/pull semantics, a runner storage-driver
# workaround, disk-space reclamation before a multi-GB ISO build).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1. Precheck
        run: python3 scripts/check.py

      - name: 2. Build image
        run: |
          sudo apt-get update && sudo apt-get install -y podman

          # ubuntu-latest ships ~14GB free by default, most of it eaten by
          # preinstalled toolchains this job never touches (.NET, Android
          # SDK, GHC, ...) -- reclaim headroom before the multi-GB ISO
          # build, rather than find out mid-build (see git history: two
          # runs died with a burst of simultaneous "Error downloading"
          # package failures, the signature of running out of disk mid
          # parallel-download-batch).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules || true

          # GitHub's runner images ship /var/lib/containers/storage in an
          # inconsistent state; the first thing to touch it as root can hit
          # a graph-driver mismatch or other corruption. This is bootc-
          # image-builder's own upstream fix for exactly that, copied
          # verbatim from their currently-working GH Actions CI:
          # https://github.com/osbuild/bootc-image-builder/issues/446
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          echo -e "[storage]\ndriver = \"overlay\"\nrunroot = \"/run/containers/storage\"\ngraphroot = \"/var/lib/containers/storage\"" | sudo tee /etc/containers/storage.conf

          python3 scripts/build_image.py

          # Installer image (Containerfile.installer, FROM the appliance
          # image just built above) -- the live, kickstart-free environment
          # that partitions disks and `bootc install`s the appliance image.
          # See scripts/build_installer_image.py's docstring.
          python3 scripts/build_installer_image.py

      # localhost/slfhst-installer:latest -- the image build_installer_image.py
      # just produced, used directly (no GHCR round-trip). See
      # build_iso.py's docstring for how it gets a rootless-podman-built
      # local image into the rootful storage bootc-image-builder needs.
      - name: 3. Build ISO
        run: python3 scripts/build_iso.py --type bootc-generic-iso --output output

      - name: Diagnose failure (memory/kernel log)
        if: failure()
        run: |
          free -h
          sudo dmesg -T | tail -100 || true

      - name: 4. Publish image
        run: |
          DATE_TAG="$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          podman tag localhost/slfhst:latest "$IMAGE:stable"
          podman tag localhost/slfhst:latest "$IMAGE:$DATE_TAG"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE:stable"
          podman push "$IMAGE:$DATE_TAG"

      # Rolling: always the "latest" tag/release, replacing whatever ISO
      # was there before -- see scripts/publish_release.py's docstring.
      - name: 5. Publish ISO
        run: |
          ISO_PATH="$(find output -name '*.iso' -print -quit)"
          if [ -z "$ISO_PATH" ]; then
            echo "no .iso produced under output/" >&2
            find output -maxdepth 3 >&2
            exit 1
          fi
          python3 scripts/publish_release.py --tag latest --image "$IMAGE:$DATE_TAG" --iso-path "$ISO_PATH" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
