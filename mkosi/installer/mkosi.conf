# slfhst live installer: boots, runs `slfhst install` on the console
# (see systemd/system/slfhst-install.service), reboots into the deployed
# appliance. A single self-contained image, unlike the appliance build --
# its own /etc ships as part of this build directly (no DPS root/var
# split concern here, this environment is fully ephemeral), so a plain
# `systemctl enable` at build time is fine (see mkosi.postinst.chroot),
# unlike the appliance's preset-file approach.
#
# Format=directory, NOT disk+ElTorito -- DeepWiki described ElTorito= as
# real mkosi functionality, but a real build against the actual packaged
# mkosi (26, Fedora 44's current version, systemd 259) failed with
# "Unknown setting ElTorito": either a not-yet-released mkosi feature or
# something this project misread: not verifiable further without a
# newer mkosi than what's installable here. Falling back to the ISO
# assembly mechanism this project already proved works in its own
# history: mksquashfs + grub2-mkrescue (scripts/build_installer_iso.py,
# bootc era) -- this build just produces the assembled rootfs as a plain
# directory; a separate step (Milestone C, ISO assembly) squashes and
# wraps it exactly the same way.
[Distribution]
Distribution=fedora
Release=44

[Output]
Format=directory
ImageId=slfhst-installer

[Content]
# NOT mkosi's own UKI/systemd-boot generation -- this environment boots
# via dmsquash-live (dracut-live) + grub2-mkrescue instead, handled by
# mkosi.postinst.chroot (initramfs rebuild) and a separate ISO-assembly
# step outside mkosi entirely (mksquashfs + grub2-mkrescue against this
# build's directory output). Bootable=no so mkosi doesn't also try to
# build a UKI/ESP nothing here uses.
Bootable=no

# Smaller than the appliance's list on purpose -- this environment only
# needs to select disks, partition them, deploy the embedded appliance
# content, and run stage1 setup, then reboot. No podman/firewalld/full
# pam stack/sudo/container-selinux -- those run on the deployed
# appliance, never here.
#
# google-authenticator and the ssh-keygen-providing package ARE needed
# here even though they're also in the appliance's list -- correcting an
# earlier assumption in this plan: internal/totp execs both as plain
# argv commands against the *target* path (not chrooted, confirmed
# working via their own -f/-s flags), so the binaries need to exist in
# whatever process is actually running them -- this installer's own
# environment, not the target it's writing into.
#
# dracut-live + squashfs-tools + the grub2/xorriso/shim set: direct port
# of Containerfile.installer's exact package list (bootc era) -- same
# ISO-assembly mechanism, just a much smaller mkosi-built installroot
# feeding it instead of the full appliance image.
Packages=
  systemd
  parted
  xfsprogs
  dosfstools
  kernel
  google-authenticator
  openssh-clients
  dracut-live
  device-mapper
  squashfs-tools
  grub2-tools-extra
  xorriso
  grub2-pc
  grub2-pc-modules
  grub2-efi-x64
  grub2-efi-x64-modules
  grub2-efi-x64-cdboot
  shim-x64
