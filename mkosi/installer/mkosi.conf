# slfhst live installer: boots, auto-logs in as root on every console
# (getty@.service.d/serial-getty@.service.d autologin drop-ins), whose
# login shell (RootShell=, below) decides whether to run `slfhst
# install` or drop to a plain shell -- see mkosi.extra's
# usr/bin/slfhst-console-wrapper. Reboots into the deployed appliance.
# A single self-contained image, unlike the appliance build -- its own
# /etc ships as part of this build directly (no DPS root/var split
# concern here, this environment is fully ephemeral), so a plain
# `systemctl enable` at build time is fine, unlike the appliance's
# preset-file approach.
#
# Format=directory, NOT disk+ElTorito -- DeepWiki described ElTorito= as
# real mkosi functionality, but a real build against the actual packaged
# mkosi (26, Fedora 44's current version, systemd 259) failed with
# "Unknown setting ElTorito": either a not-yet-released mkosi feature or
# something this project misread: not verifiable further without a
# newer mkosi than what's installable here. Falling back to the ISO
# assembly mechanism this project already proved works in its own
# history: mksquashfs + grub2-mkrescue (scripts/build_installer_iso.py,
# bootc era) -- this build just produces the assembled rootfs as a plain
# directory; a separate step (Milestone C, ISO assembly) squashes and
# wraps it exactly the same way.
[Distribution]
Distribution=fedora
Release=44

[Output]
Format=directory
ImageId=slfhst-installer

[Content]
# NOT mkosi's own UKI/systemd-boot generation -- this environment boots
# via dmsquash-live (dracut-live) + grub2-mkrescue instead, handled
# entirely by build-iso.sh (initramfs rebuild via a plain `chroot`, then
# mksquashfs + grub2-mkrescue), outside mkosi's own build pipeline --
# confirmed the exact same dracut/dmsquash-live invocation succeeds via
# a direct chroot but fails inside mkosi's own sandboxed script
# execution. Bootable=no so mkosi doesn't also try to build a UKI/ESP
# nothing here uses.
Bootable=no

# RootShell=: sets root's login shell to the console wrapper via
# mkosi's own build-time `systemd-firstboot --root-shell=` invocation
# (mkosi's documented, recommended mechanism for this) -- NOT a
# mkosi.postinst.chroot `usermod` call, which this project used
# originally and which turned out not to survive to the final image:
# confirmed via DeepWiki against mkosi's own source
# (mkosi/__init__.py) that mkosi's build pipeline runs
# mkosi.postinst.chroot scripts (step 17) well before its own
# automatic `systemd-firstboot` invocation (step 22) -- real,
# install-blocking symptom on real hardware: root auto-logged in
# correctly on every console, but always landed at a plain default
# shell instead of running `slfhst install`, meaning whatever
# usermod set earlier wasn't what ended up in the final image's
# /etc/passwd. RootShell= runs authoritatively later in the same
# pipeline, so there's no step-ordering assumption left to get wrong.
RootShell=/usr/bin/slfhst-console-wrapper

# Smaller than the appliance's list on purpose -- this environment only
# needs to select disks, partition them, deploy the embedded appliance
# content, and run stage1 setup, then reboot. No podman/firewalld/full
# pam stack/sudo/container-selinux -- those run on the deployed
# appliance, never here.
#
# openssh-clients provides ssh-keygen, used to generate the target's
# host keys via `ssh-keygen -A -f <target>` -- runs against the target
# path directly, not chrooted, so it needs to exist in this installer's
# own environment.
#
# dracut-live + squashfs-tools + the grub2/xorriso/shim set: direct port
# of Containerfile.installer's exact package list (bootc era) -- same
# ISO-assembly mechanism, just a much smaller mkosi-built installroot
# feeding it instead of the full appliance image.
#
# shadow-utils: general account-management tools (passwd/chsh/etc.),
# not pulled in transitively by anything else on this minimal package
# list -- confirmed by a real CI build failing outright with "usermod:
# command not found" back when a mkosi.postinst.chroot script used
# usermod directly (since replaced by RootShell=, above, but kept here
# since shadow-utils' tools are still reasonable to have present in an
# interactive installer shell).
#
# e2fsprogs / erofs-utils: `slfhst install`'s PartitionRoot
# (internal/disks.go) drives systemd-repart against Format=ext4 (root,
# var) and Format=erofs (usr-A, usr-B) partitions -- confirmed via
# DeepWiki against systemd's own src/shared/mkfs-util.c that
# systemd-repart always shells out to a real mkfs.<fstype> binary for
# these rather than implementing filesystem creation itself, so
# mkfs.ext4/mkfs.erofs must exist in this installer's own environment,
# not just the appliance's. dosfstools (mkfs.vfat, for the ESP) and
# xfsprogs (mkfs.xfs, for the bulk data disk's plain parted+xfs layout)
# were already here; e2fsprogs/erofs-utils were not, and neither is
# pulled in transitively by anything else on this minimal package list
# -- same class of gap as the shadow-utils fix above, caught by reading
# every Format= this project's own code actually requests rather than
# waiting for another real-hardware round trip to find it.
#
# systemd-boot: `internal/disks.InstallBootloader` runs `bootctl
# --esp-path=<target> install` from inside THIS installer environment
# (targeting the real disk's ESP, not the appliance's own), and
# `bootctl install` needs the actual systemd-boot EFI binaries on the
# machine running it (/usr/lib/systemd/boot/efi/*.efi) to copy onto the
# target's ESP -- confirmed as a real, install-blocking bug on real
# hardware: "Failed to open boot loader directory
# /usr/lib/systemd/boot/efi: No such file or directory". Plain
# `systemd` does not provide this directory; the same package name
# (`systemd-boot`) is already confirmed correct and resolving cleanly
# in mkosi/appliance/mkosi.conf's own package list (Milestone A), it
# was just never added here too.
Packages=
  systemd
  systemd-boot
  shadow-utils
  parted
  xfsprogs
  dosfstools
  e2fsprogs
  erofs-utils
  kernel
  openssh-clients
  dracut-live
  device-mapper
  squashfs-tools
  grub2-tools-extra
  xorriso
  grub2-pc
  grub2-pc-modules
  grub2-efi-x64
  grub2-efi-x64-modules
  grub2-efi-x64-cdboot
  shim-x64
