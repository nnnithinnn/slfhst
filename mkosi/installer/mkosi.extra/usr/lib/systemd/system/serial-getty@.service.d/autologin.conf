# Same as getty@.service.d/autologin.conf, for serial consoles --
# --keep-baud kept from upstream's own serial-getty@.service.in
# (matters on a real serial line, unlike the local-VT-only getty
# template above) with the same baud rate list, including 115200 to
# match this project's own console=ttyS0,115200n8 kernel cmdline.
[Service]
ExecStart=
ExecStart=-agetty --autologin root --keep-baud 115200,57600,38400,9600 --noclear %I $TERM
