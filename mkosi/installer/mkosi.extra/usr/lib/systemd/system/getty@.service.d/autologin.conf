# Auto-login as root on every local (VT) console in the live installer
# environment -- which console the admin is actually watching (a
# real/KVM/VNC-style graphical console, or serial) is genuinely
# ambiguous ahead of time, so every console reaches the same decision
# point instead of one console being hardcoded and silently invisible
# on any other (confirmed the hard way this session, twice: once on
# serial, once on a VNC console). Root's login shell (set via
# mkosi.conf's RootShell= to usr/bin/slfhst-console-wrapper) decides
# from there whether to start the installer or drop to a plain shell.
#
# ExecStart= must be fully replaced, not appended to -- systemd doesn't
# support partial edits, and a `-` prefix means agetty may fail without
# aborting the whole unit. Otherwise the same base flags upstream's own
# getty@.service.in uses (--noclear so the previous console's output
# stays visible on autologin), following the exact pattern systemd's
# own test suite uses for this (test/units/TEST-35-LOGIN.sh).
[Service]
ExecStart=
ExecStart=-agetty --autologin root --noclear %I $TERM
