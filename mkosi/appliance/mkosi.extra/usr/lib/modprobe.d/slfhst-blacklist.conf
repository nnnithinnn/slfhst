# Block loading of uncommon network protocol modules this appliance never
# uses -- standard CIS/STIG-style server hardening. `install ... /bin/false`
# (not `blacklist`) so this also blocks an explicit `modprobe <name>`, not
# just auto-loading via alias resolution.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
