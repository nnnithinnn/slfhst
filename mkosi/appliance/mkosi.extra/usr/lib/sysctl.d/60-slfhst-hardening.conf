# Baseline kernel network/hardening tuning. GreenCloudVPS (like most VPS
# providers) already scrubs volumetric L3/L4 DDoS at the network edge --
# this is standard defense-in-depth underneath that, not a replacement
# for it, and it's the layer below Stalwart's own connection/rate limits
# (see usr/share/slfhst/templates/stalwart-hardening.toml.tmpl) and
# firewalld/fail2ban.
#
# net.ipv4.ip_forward is deliberately NOT touched/disabled here: rootless
# podman's bridge networking (the `slfhst` custom network every quadlet
# uses) needs it enabled to NAT container traffic. Explicitly set to 1
# below so that intent survives if anyone copies a stricter hardening
# profile in later without knowing why it can't be 0 on this box.
net.ipv4.ip_forward = 1

# SYN flood protection. Stalwart has its own connection-loitering
# protection at the application layer; this is the kernel-level backstop
# for everything (SSH, Traefik, mail ports) underneath it.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.core.somaxconn = 4096

# Anti-spoofing: reject packets whose reverse path doesn't match the
# route we'd use to answer them. Safe for a standard single-NIC VPS with
# one default route (which is what stage1's network setup produces,
# static or DHCP) -- verify after applying if this box ever gets unusual
# multi-homed/asymmetric routing.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Don't accept ICMP redirects (anti-MITM) or source-routed packets
# (anti-spoofing); don't originate redirects ourselves either.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Ignore broadcast ICMP echo (anti-smurf).
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Reduce kernel information leakage to unprivileged local processes.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1

# No core dumps for setuid binaries (could otherwise leak sensitive
# memory contents to disk).
fs.suid_dumpable = 0

# Full ASLR (almost always already the distro default -- explicit here
# so it's not silently relying on that).
kernel.randomize_va_space = 2

# Disable the magic SysRq key. Console/emergency access on this box goes
# through the VPS provider's own KVM/serial console, which already
# implies meaningful control; SysRq is one more thing a compromised
# local process (or a user with physical/console access who shouldn't
# have kernel-level control) could abuse.
kernel.sysrq = 0
