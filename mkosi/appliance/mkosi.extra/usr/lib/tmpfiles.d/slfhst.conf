# Persistent state under /var (its own DPS partition -- see the v2 plan's
# "OS image architecture" -- never touched by a `usr` slot update) and the
# /srv/data mountpoint for the bulk-disk `.mount` unit (internal/disks).
# systemd normally creates a missing mountpoint directory itself when
# starting a `.mount` unit, but this is a cheap, explicit safety net.
d /var/lib/slfhst 0755 root root -
d /srv/data 0755 root root -
