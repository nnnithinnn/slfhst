# slfhst appliance content build. Produces (via SplitArtifacts=yes,
# confirmed this session to yield exactly the shape systemd-sysupdate's
# url-file transfers expect): <ImageId>_<version>.efi (the UKI) and
# <ImageId>_<version>.usr-<arch>.raw (this build's one partition, see
# mkosi.repart/10-usr.conf) -- the two artifacts internal/installer's
# Milestone B deploy step dd's/copies into place, and what publish.yml
# uploads for systemd-sysupdate to fetch.
#
# ImageVersion is deliberately NOT set here -- CI passes
# --image-version=<date>-<sha> at build time (see publish.yml), matching
# the existing DATE_TAG convention this project already used for the
# bootc-era image tags.
[Distribution]
Distribution=fedora
Release=44

[Output]
Format=disk
SplitArtifacts=yes
ImageId=slfhst

[Content]
Bootable=yes

# Explicit list, no @core/@standard groups -- per the plan's "Minimal
# package set": glibc/systemd/coreutils/util-linux/podman/selinux/
# firewalld/our CLI, plus the "genuinely needed" additions it names
# (openssh-server, sudo, the TOTP stack, disk tooling). systemd-udev is
# separate from the base systemd package on Fedora and is what actually
# ships systemd-sysupdate (confirmed via `rpm -qf` this session) --
# needed on the deployed appliance itself, not just at build time.
Packages=
  systemd
  systemd-udev
  systemd-boot
  podman
  selinux-policy-targeted
  policycoreutils
  container-selinux
  firewalld
  openssh-server
  sudo
  google-authenticator
  qrencode
  pam
  parted
  xfsprogs
  dosfstools
  kernel

# pam-ssh-auth-info's build deps -- KNOWN COMPROMISE, not the intended
# end state. These stay in the final image (gcc/autoconf/automake/
# libtool/pam-devel/git, ~100-200MB) rather than being cleaned up,
# because every avenue to remove them was tried for real and blocked by
# this specific sandbox, not a design choice:
#   - BuildPackages= (the idiomatic mechanism, auto-excluded from the
#     final image, no manual cleanup needed) failed with mkosi's own
#     internal sandbox mount code during "Installing build packages"
#     ("OSError: [Errno 22] Invalid argument: 'newroot/buildroot'") --
#     likely another nested-container sandboxing limitation like
#     PR_SET_MM/loop-devices found earlier this session.
#   - A postinst/prepare script removing them itself via dnf5 can't
#     work either way: dnf5 is never installed *into* the target image
#     at all (confirmed: "dnf5: command not found" inside
#     mkosi.prepare.chroot) -- mkosi drives package installs from its
#     own external tools tree against --installroot=, so there's no
#     in-chroot package manager to self-clean with regardless of which
#     script hook is used.
# TODO: retry BuildPackages= on a real (non-nested-sandboxed) CI runner
# -- the failure looks environment-specific, not a real mkosi bug, and
# GitHub's runners aren't nested the way this dev sandbox is.
  gcc
  autoconf
  automake
  libtool
  pam-devel
  git
