# slfhst appliance content build. Produces (via SplitArtifacts=yes,
# confirmed this session to yield exactly the shape systemd-sysupdate's
# url-file transfers expect): <ImageId>_<version>.efi (the UKI) and
# <ImageId>_<version>.usr-<arch>.raw (this build's one partition, see
# mkosi.repart/10-usr.conf) -- the two artifacts internal/installer's
# Milestone B deploy step dd's/copies into place, and what publish.yml
# uploads for systemd-sysupdate to fetch.
#
# ImageVersion is deliberately NOT set here -- CI passes
# --image-version=<date>-<sha> at build time (see publish.yml), matching
# the existing DATE_TAG convention this project already used for the
# bootc-era image tags.
[Distribution]
Distribution=fedora
Release=44

[Output]
Format=disk
SplitArtifacts=yes
ImageId=slfhst

[Content]
Bootable=yes

# Real VPS/cloud providers overwhelmingly expose only a serial console
# (a web-based "serial console" tool, or IPMI serial-over-LAN), not a
# graphical/VGA one -- confirmed the hard way: on a real hardware boot
# of this project's own installer ISO, the console went completely
# static right after the first [FAILED] unit message (systemd's own
# failure messages print even under `quiet`; nothing else did, because
# nothing was actually configured to write to the serial port the
# provider's console was bridging). No console= at all previously.
# Keeps tty0 too, so a real graphical console still works.
KernelCommandLine=console=ttyS0,115200n8 console=tty0

# Explicit list, no @core/@standard groups -- per the plan's "Minimal
# package set": glibc/systemd/coreutils/util-linux/podman/selinux/
# firewalld/our CLI, plus the "genuinely needed" additions it names
# (openssh-server, sudo, disk tooling). systemd-udev is
# separate from the base systemd package on Fedora and is what actually
# ships systemd-sysupdate (confirmed via `rpm -qf` this session) --
# needed on the deployed appliance itself, not just at build time.
Packages=
  systemd
  systemd-udev
  systemd-boot
  podman
  selinux-policy-targeted
  policycoreutils
  container-selinux
  firewalld
  openssh-server
  sudo
  pam
  parted
  xfsprogs
  dosfstools
  kernel
