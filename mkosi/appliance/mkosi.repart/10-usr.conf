# The appliance build only ever produces ONE partition: the content that
# becomes a systemd-sysupdate-managed usr-<arch> slot at install/update
# time (see internal/disks.PartitionRoot for the actual A/B usr-A/usr-B
# layout, which is the *installer's* job against the real target disk --
# this build just needs to produce that partition's *content* as a split
# artifact, not a whole bootable disk of its own).
#
# Auto-sizing to fit content did NOT work leaving this unset (confirmed:
# a real build failed with "Partition 0's contents (603.5M) don't fit in
# the partition (1008K)" -- repart's minimal-size guess doesn't account
# for CopyFiles= content the way it does for mkosi's own default root
# partition generation). Explicit size instead, matching
# internal/disks.go's usrSlotSize constant so both sides of the A/B slot
# story agree on the same number -- keep them in sync if either changes.
[Partition]
Type=usr
Format=erofs
SizeMinBytes=1200M
SizeMaxBytes=3G
# A custom mkosi.repart/ directory disables ALL of mkosi's own default
# partition generation, including the CopyFiles= it would otherwise add
# automatically -- confirmed via DeepWiki after a first build silently
# produced a ~3MB partition instead of the real installed content.
# Type=usr partitions mount directly at /usr (systemd-gpt-auto-generator),
# so the source is the build root's /usr/ tree, target is the partition's
# own root.
CopyFiles=/usr/:/
