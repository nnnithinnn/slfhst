# Persistent logs (survive reboots -- useful for slfhst-monitor and for
# actually investigating anything, including abuse hitting the mail/SSH
# ports) but explicitly bounded: journald's default Storage=auto only
# persists IF /var/log/journal already exists, and unbounded log growth
# from a connection-flood or log-flood attempt is itself a secondary DoS
# vector -- /var/log/journal lives on the fast NVMe with everything else
# in /var, not the bulk SSD, so filling it can take the whole appliance
# down, not just fill up spare capacity.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
