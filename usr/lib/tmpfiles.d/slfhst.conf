# Persistent state under /var, declared for systemd-tmpfiles rather than
# baked directly into the image layer -- /var starts empty per ostree/bootc
# deployment and is populated at boot time from entries like these (`bootc
# container lint` flags directly-baked /var content for exactly this
# reason). /var/lib/fail2ban and the exim entries are included because
# those EPEL packages don't ship their own tmpfiles.d entries (exim is a
# hard dependency of fail2ban-sendmail, not something we chose to install
# -- see Containerfile).
d /var/lib/slfhst 0755 root root -
d /var/srv/data 0755 root root -
d /var/lib/fail2ban 0755 root root -
d /var/log/exim 0750 root root -
d /var/spool/exim 0750 root root -
d /var/spool/exim/db 0750 root root -
d /var/spool/exim/input 0750 root root -
d /var/spool/exim/msglog 0750 root root -
