# Persistent state under /var, declared for systemd-tmpfiles rather than
# baked directly into the image layer -- /var starts empty per ostree/bootc
# deployment and is populated at boot time from entries like these (`bootc
# container lint` flags directly-baked /var content for exactly this
# reason). /var/lib/fail2ban is included because the EPEL package doesn't
# ship its own tmpfiles.d entry.
d /var/lib/slfhst 0755 root root -
d /var/srv/data 0755 root root -
d /var/lib/fail2ban 0755 root root -
